<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Editor Pro - Like Adobe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1e1e1e;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        /* Adobe-like toolbar */
        .toolbar {
            background: #2d2d2d;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid #3d3d3d;
            user-select: none;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 8px;
            border-right: 1px solid #3d3d3d;
        }

        .toolbar-group:last-child {
            border-right: none;
        }

        .toolbar-button {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: transparent;
            border: none;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }

        .toolbar-button:hover {
            background: #3d3d3d;
        }

        .toolbar-button.active {
            background: #0d6efd;
        }

        .toolbar-button i {
            font-size: 16px;
        }

        /* Main container */
        .main-container {
            display: flex;
            height: calc(100vh - 50px);
        }

        /* Left sidebar - Pages */
        .pages-sidebar {
            width: 250px;
            background: #252525;
            border-right: 1px solid #3d3d3d;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 16px;
            font-weight: 600;
            border-bottom: 1px solid #3d3d3d;
        }

        .pages-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .page-thumbnail {
            background: #2d2d2d;
            border: 2px solid transparent;
            border-radius: 4px;
            margin-bottom: 12px;
            padding: 8px;
            cursor: pointer;
            transition: border-color 0.2s;
            position: relative;
        }

        .page-thumbnail:hover {
            border-color: #0d6efd;
        }

        .page-thumbnail.active {
            border-color: #0d6efd;
            background: #353535;
        }

        .page-preview {
            height: 120px;
            background: #fff;
            border-radius: 2px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 12px;
        }

        .page-number {
            font-size: 12px;
            color: #999;
            text-align: center;
        }

        /* Center area - PDF Viewer/Editor */
        .pdf-viewer {
            flex: 1;
            background: #1a1a1a;
            position: relative;
            overflow: auto;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        #pdf-container {
            background: #2d2d2d;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            position: relative;
        }

        .pdf-page {
            position: relative;
            margin-bottom: 20px;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .pdf-page canvas {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Annotation layer */
        .annotation-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .annotation-layer.drawing-mode {
            pointer-events: auto;
        }

        .annotation {
            position: absolute;
            border: 2px solid #0d6efd;
            background: rgba(13, 110, 253, 0.1);
            cursor: move;
        }

        .annotation.selected {
            border-color: #ffc107;
            background: rgba(255, 193, 7, 0.1);
        }

        .text-annotation {
            font-family: Arial, sans-serif;
            font-size: 14px;
            color: #000;
            background: rgba(255, 255, 0, 0.3);
            padding: 2px 4px;
            border: 1px solid #ffc107;
        }

        /* Right sidebar - Properties */
        .properties-sidebar {
            width: 300px;
            background: #252525;
            border-left: 1px solid #3d3d3d;
            display: flex;
            flex-direction: column;
        }

        .properties-content {
            padding: 16px;
            overflow-y: auto;
        }

        .property-group {
            margin-bottom: 20px;
        }

        .property-label {
            font-size: 12px;
            color: #999;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .property-input {
            width: 100%;
            padding: 8px;
            background: #2d2d2d;
            border: 1px solid #3d3d3d;
            color: #fff;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .property-input:focus {
            outline: none;
            border-color: #0d6efd;
        }

        .color-picker {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .color-option {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .color-option:hover {
            transform: scale(1.1);
        }

        .color-option.selected {
            border-color: #fff;
        }

        /* Status bar */
        .status-bar {
            background: #2d2d2d;
            padding: 4px 16px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #999;
            border-top: 1px solid #3d3d3d;
        }

        /* Loading overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0d6efd;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Context menu */
        .context-menu {
            position: absolute;
            background: #2d2d2d;
            border: 1px solid #3d3d3d;
            border-radius: 4px;
            padding: 4px 0;
            display: none;
            z-index: 1000;
        }

        .context-menu-item {
            padding: 8px 24px;
            cursor: pointer;
            font-size: 13px;
        }

        .context-menu-item:hover {
            background: #3d3d3d;
        }

        /* Icons (Font Awesome-like) */
        .icon-file:before { content: "📄"; }
        .icon-edit:before { content: "✏️"; }
        .icon-text:before { content: "T"; }
        .icon-image:before { content: "🖼️"; }
        .icon-signature:before { content: "✍️"; }
        .icon-save:before { content: "💾"; }
        .icon-zoom-in:before { content: "🔍+"; }
        .icon-zoom-out:before { content: "🔍-"; }
        .icon-hand:before { content: "✋"; }
        .icon-select:before { content: "⬆️"; }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <!-- Context Menu -->
    <div class="context-menu" id="contextMenu">
        <div class="context-menu-item" onclick="deleteSelectedAnnotation()">Delete</div>
        <div class="context-menu-item" onclick="copyAnnotation()">Copy</div>
        <div class="context-menu-item" onclick="cutAnnotation()">Cut</div>
        <div class="context-menu-item" onclick="bringToFront()">Bring to Front</div>
    </div>

    <!-- Main Toolbar -->
    <div class="toolbar">
        <div class="toolbar-group">
            <button class="toolbar-button" onclick="loadPDF()">
                <i class="icon-file"></i> Open
            </button>
            <button class="toolbar-button" onclick="savePDF()">
                <i class="icon-save"></i> Save
            </button>
        </div>

        <div class="toolbar-group">
            <button class="toolbar-button" onclick="selectTool('select')" id="toolSelect">
                <i class="icon-select"></i> Select
            </button>
            <button class="toolbar-button" onclick="selectTool('text')" id="toolText">
                <i class="icon-text"></i> Text
            </button>
            <button class="toolbar-button" onclick="selectTool('draw')" id="toolDraw">
                <i class="icon-edit"></i> Draw
            </button>
            <button class="toolbar-button" onclick="selectTool('image')" id="toolImage">
                <i class="icon-image"></i> Image
            </button>
            <button class="toolbar-button" onclick="selectTool('signature')" id="toolSignature">
                <i class="icon-signature"></i> Signature
            </button>
        </div>

        <div class="toolbar-group">
            <button class="toolbar-button" onclick="zoomIn()">
                <i class="icon-zoom-in"></i>
            </button>
            <button class="toolbar-button" onclick="zoomOut()">
                <i class="icon-zoom-out"></i>
            </button>
            <button class="toolbar-button" onclick="fitToPage()">
                Fit Page
            </button>
        </div>

        <div class="toolbar-group">
            <button class="toolbar-button" onclick="addTextAnnotation()">
                Add Text
            </button>
            <button class="toolbar-button" onclick="addHighlight()">
                Highlight
            </button>
            <button class="toolbar-button" onclick="addStrikeout()">
                Strikeout
            </button>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-container">
        <!-- Pages Sidebar -->
        <div class="pages-sidebar">
            <div class="sidebar-header">
                Pages
                <button style="float: right;" onclick="addBlankPage()">+</button>
            </div>
            <div class="pages-list" id="pagesList">
                <!-- Pages will be dynamically added here -->
            </div>
        </div>

        <!-- PDF Viewer -->
        <div class="pdf-viewer" id="pdfViewer">
            <div id="pdf-container"></div>
        </div>

        <!-- Properties Sidebar -->
        <div class="properties-sidebar">
            <div class="sidebar-header">
                Properties
            </div>
            <div class="properties-content" id="propertiesPanel">
                <div class="property-group">
                    <div class="property-label">Font</div>
                    <select class="property-input" id="fontFamily" onchange="updateTextProperties()">
                        <option value="Arial">Arial</option>
                        <option value="Times New Roman">Times New Roman</option>
                        <option value="Courier New">Courier New</option>
                        <option value="Helvetica">Helvetica</option>
                    </select>
                    
                    <div class="property-label">Font Size</div>
                    <input type="number" class="property-input" id="fontSize" value="12" min="8" max="72" onchange="updateTextProperties()">
                    
                    <div class="property-label">Color</div>
                    <div class="color-picker" id="colorPicker">
                        <div class="color-option selected" style="background: #000000;" onclick="selectColor('#000000')"></div>
                        <div class="color-option" style="background: #ff0000;" onclick="selectColor('#ff0000')"></div>
                        <div class="color-option" style="background: #0000ff;" onclick="selectColor('#0000ff')"></div>
                        <div class="color-option" style="background: #00ff00;" onclick="selectColor('#00ff00')"></div>
                        <div class="color-option" style="background: #ffff00;" onclick="selectColor('#ffff00')"></div>
                    </div>
                </div>

                <div class="property-group">
                    <div class="property-label">Position</div>
                    <input type="text" class="property-input" id="positionX" placeholder="X" readonly>
                    <input type="text" class="property-input" id="positionY" placeholder="Y" readonly>
                    
                    <div class="property-label">Size</div>
                    <input type="text" class="property-input" id="sizeWidth" placeholder="Width" readonly>
                    <input type="text" class="property-input" id="sizeHeight" placeholder="Height" readonly>
                </div>

                <div class="property-group">
                    <div class="property-label">Opacity</div>
                    <input type="range" class="property-input" id="opacity" min="0" max="100" value="100" onchange="updateOpacity()">
                </div>

                <div class="property-group">
                    <button class="toolbar-button" style="width: 100%;" onclick="deleteSelectedAnnotation()">
                        Delete Selected
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
        <div id="pageInfo">Page 1 of 1</div>
        <div id="zoomLevel">100%</div>
        <div id="selectionInfo">No selection</div>
    </div>

    <!-- Hidden file input for PDF upload -->
    <input type="file" id="fileInput" accept=".pdf" style="display: none;">

    <!-- Include PDF.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js"></script>

    <script>
        // PDF.js configuration
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        // Application state
        let pdfDoc = null;
        let currentPage = 1;
        let totalPages = 0;
        let zoom = 1.0;
        let currentTool = 'select';
        let annotations = [];
        let selectedAnnotation = null;
        let isDrawing = false;
        let currentColor = '#000000';
        let currentFontSize = 12;
        let currentFontFamily = 'Arial';

        // Initialize the application
        document.addEventListener('DOMContentLoaded', function() {
            // Load a sample PDF or create blank
            loadSamplePDF();
            
            // Setup event listeners
            setupEventListeners();
            
            // Initialize with select tool active
            selectTool('select');
        });

        function setupEventListeners() {
            // PDF viewer click events for annotations
            document.getElementById('pdf-container').addEventListener('mousedown', startDrawing);
            document.getElementById('pdf-container').addEventListener('mousemove', draw);
            document.getElementById('pdf-container').addEventListener('mouseup', stopDrawing);
            document.getElementById('pdf-container').addEventListener('mouseleave', stopDrawing);
            
            // Context menu
            document.getElementById('pdf-container').addEventListener('contextmenu', showContextMenu);
            
            // Window click to hide context menu
            window.addEventListener('click', function() {
                document.getElementById('contextMenu').style.display = 'none';
            });
        }

        function loadSamplePDF() {
            // Create a simple blank PDF or load a sample
            showLoading();
            
            // For demonstration, we'll load a sample PDF from a URL
            const loadingTask = pdfjsLib.getDocument('https://raw.githubusercontent.com/mozilla/pdf.js/ba2edeae/web/compressed.tracemonkey-pldi-09.pdf');
            
            loadingTask.promise.then(function(pdf) {
                pdfDoc = pdf;
                totalPages = pdf.numPages;
                updatePageInfo();
                renderPage(currentPage);
                generatePageThumbnails();
                hideLoading();
            }).catch(function(error) {
                console.error('Error loading PDF:', error);
                // Create a blank page if loading fails
                createBlankPDF();
                hideLoading();
            });
        }

        function createBlankPDF() {
            // Create a simple blank PDF structure
            totalPages = 1;
            pdfDoc = {
                numPages: 1,
                getPage: function(pageNum) {
                    return Promise.resolve({
                        getViewport: function() {
                            return { width: 612, height: 792 };
                        },
                        render: function() {
                            return Promise.resolve();
                        }
                    });
                }
            };
            renderPage(1);
            generatePageThumbnails();
            updatePageInfo();
        }

        function renderPage(pageNum) {
            if (!pdfDoc) return;
            
            pdfDoc.getPage(pageNum).then(function(page) {
                const viewport = page.getViewport({ scale: zoom });
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                
                const renderContext = {
                    canvasContext: context,
                    viewport: viewport
                };
                
                // Clear container and add new canvas
                const container = document.getElementById('pdf-container');
                container.innerHTML = '';
                
                // Create page wrapper
                const pageWrapper = document.createElement('div');
                pageWrapper.className = 'pdf-page';
                pageWrapper.id = `page-${pageNum}`;
                pageWrapper.style.width = viewport.width + 'px';
                pageWrapper.style.height = viewport.height + 'px';
                
                pageWrapper.appendChild(canvas);
                
                // Create annotation layer
                const annotationLayer = document.createElement('div');
                annotationLayer.className = 'annotation-layer';
                annotationLayer.id = `annotation-layer-${pageNum}`;
                pageWrapper.appendChild(annotationLayer);
                
                container.appendChild(pageWrapper);
                
                // Render PDF page
                page.render(renderContext).promise.then(function() {
                    renderAnnotations(pageNum);
                });
            });
        }

        function generatePageThumbnails() {
            const pagesList = document.getElementById('pagesList');
            pagesList.innerHTML = '';
            
            for (let i = 1; i <= totalPages; i++) {
                const thumbnail = document.createElement('div');
                thumbnail.className = 'page-thumbnail' + (i === currentPage ? ' active' : '');
                thumbnail.onclick = () => goToPage(i);
                
                const preview = document.createElement('div');
                preview.className = 'page-preview';
                preview.textContent = `Page ${i}`;
                
                const pageNumber = document.createElement('div');
                pageNumber.className = 'page-number';
                pageNumber.textContent = `Page ${i}`;
                
                thumbnail.appendChild(preview);
                thumbnail.appendChild(pageNumber);
                pagesList.appendChild(thumbnail);
            }
        }

        function goToPage(pageNum) {
            currentPage = pageNum;
            renderPage(currentPage);
            updatePageInfo();
            
            // Update active thumbnail
            document.querySelectorAll('.page-thumbnail').forEach((thumb, index) => {
                if (index + 1 === pageNum) {
                    thumb.classList.add('active');
                } else {
                    thumb.classList.remove('active');
                }
            });
        }

        function loadPDF() {
            document.getElementById('fileInput').click();
        }

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file && file.type === 'application/pdf') {
                const fileReader = new FileReader();
                fileReader.onload = function() {
                    const typedarray = new Uint8Array(this.result);
                    pdfjsLib.getDocument(typedarray).promise.then(function(pdf) {
                        pdfDoc = pdf;
                        totalPages = pdf.numPages;
                        renderPage(1);
                        generatePageThumbnails();
                        updatePageInfo();
                    });
                };
                fileReader.readAsArrayBuffer(file);
            }
        });

        function savePDF() {
            showLoading();
            // In a real implementation, you'd use a library like jspdf or pdf-lib
            // For now, we'll just simulate saving
            setTimeout(() => {
                alert('PDF saved successfully!');
                hideLoading();
            }, 1500);
        }

        function selectTool(tool) {
            currentTool = tool;
            
            // Update active button states
            document.querySelectorAll('.toolbar-button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(`tool${tool.charAt(0).toUpperCase() + tool.slice(1)}`).classList.add('active');
            
            // Update annotation layer mode
            const annotationLayers = document.querySelectorAll('.annotation-layer');
            annotationLayers.forEach(layer => {
                if (tool !== 'select') {
                    layer.classList.add('drawing-mode');
                } else {
                    layer.classList.remove('drawing-mode');
                }
            });
        }

        function zoomIn() {
            zoom += 0.1;
            document.getElementById('zoomLevel').textContent = Math.round(zoom * 100) + '%';
            renderPage(currentPage);
        }

        function zoomOut() {
            if (zoom > 0.2) {
                zoom -= 0.1;
                document.getElementById('zoomLevel').textContent = Math.round(zoom * 100) + '%';
                renderPage(currentPage);
            }
        }

        function fitToPage() {
            const container = document.getElementById('pdfViewer');
            const pageWidth = 612; // Standard PDF width
            zoom = (container.clientWidth - 40) / pageWidth;
            document.getElementById('zoomLevel').textContent = Math.round(zoom * 100) + '%';
            renderPage(currentPage);
        }

        function addTextAnnotation() {
            const text = prompt('Enter text:', 'Sample Text');
            if (!text) return;
            
            const annotation = {
                id: 'anno_' + Date.now(),
                type: 'text',
                page: currentPage,
                text: text,
                x: 100,
                y: 100,
                width: 200,
                height: 30,
                color: currentColor,
                fontSize: currentFontSize,
                fontFamily: currentFontFamily
            };
            
            annotations.push(annotation);
            renderAnnotations(currentPage);
        }

        function addHighlight() {
            const annotation = {
                id: 'anno_' + Date.now(),
                type: 'highlight',
                page: currentPage,
                x: 100,
                y: 100,
                width: 200,
                height: 20,
                color: '#ffff00',
                opacity: 0.3
            };
            
            annotations.push(annotation);
            renderAnnotations(currentPage);
        }

        function addStrikeout() {
            const annotation = {
                id: 'anno_' + Date.now(),
                type: 'strikeout',
                page: currentPage,
                x: 100,
                y: 100,
                width: 200,
                height: 2,
                color: '#ff0000'
            };
            
            annotations.push(annotation);
            renderAnnotations(currentPage);
        }

        function renderAnnotations(pageNum) {
            const layer = document.getElementById(`annotation-layer-${pageNum}`);
            if (!layer) return;
            
            layer.innerHTML = '';
            
            const pageAnnotations = annotations.filter(a => a.page === pageNum);
            
            pageAnnotations.forEach(anno => {
                const element = document.createElement('div');
                element.className = 'annotation';
                if (anno.id === selectedAnnotation?.id) {
                    element.classList.add('selected');
                }
                
                element.style.left = anno.x + 'px';
                element.style.top = anno.y + 'px';
                element.style.width = anno.width + 'px';
                element.style.height = anno.height + 'px';
                element.style.backgroundColor = anno.color;
                element.style.opacity = anno.opacity || 1;
                element.style.position = 'absolute';
                element.style.cursor = 'move';
                
                if (anno.type === 'text') {
                    element.classList.add('text-annotation');
                    element.textContent = anno.text;
                    element.style.fontFamily = anno.fontFamily;
                    element.style.fontSize = anno.fontSize + 'px';
                    element.style.color = anno.color;
                    element.style.backgroundColor = 'transparent';
                }
                
                element.onmousedown = (e) => {
                    if (currentTool === 'select') {
                        selectAnnotation(anno);
                        startDrag(e, anno);
                    }
                };
                
                layer.appendChild(element);
            });
        }

        function selectAnnotation(anno) {
            selectedAnnotation = anno;
            renderAnnotations(currentPage);
            updatePropertiesPanel();
        }

        function startDrawing(e) {
            if (currentTool === 'draw' && e.button === 0) {
                isDrawing = true;
                const rect = e.currentTarget.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                // Start a new drawing annotation
                const annotation = {
                    id: 'draw_' + Date.now(),
                    type: 'drawing',
                    page: currentPage,
                    points: [{x, y}],
                    color: currentColor,
                    width: 2
                };
                
                annotations.push(annotation);
                selectedAnnotation = annotation;
            }
        }

        function draw(e) {
            if (!isDrawing || currentTool !== 'draw') return;
            
            const rect = e.currentTarget.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            if (selectedAnnotation && selectedAnnotation.type === 'drawing') {
                selectedAnnotation.points.push({x, y});
                renderDrawing(selectedAnnotation);
            }
        }

        function stopDrawing() {
            isDrawing = false;
            selectedAnnotation = null;
        }

        function renderDrawing(annotation) {
            // In a real implementation, you'd draw on canvas
            // For now, we'll just update the annotation layer
            renderAnnotations(currentPage);
        }

        function startDrag(e, annotation) {
            if (currentTool !== 'select') return;
            
            const startX = e.clientX;
            const startY = e.clientY;
            const startLeft = annotation.x;
            const startTop = annotation.y;
            
            function onMouseMove(e) {
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                
                annotation.x = startLeft + dx;
                annotation.y = startTop + dy;
                
                renderAnnotations(currentPage);
                updatePropertiesPanel();
            }
            
            function onMouseUp() {
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
            }
            
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        }

        function showContextMenu(e) {
            e.preventDefault();
            
            const menu = document.getElementById('contextMenu');
            menu.style.display = 'block';
            menu.style.left = e.pageX + 'px';
            menu.style.top = e.pageY + 'px';
        }

        function deleteSelectedAnnotation() {
            if (selectedAnnotation) {
                annotations = annotations.filter(a => a.id !== selectedAnnotation.id);
                selectedAnnotation = null;
                renderAnnotations(currentPage);
                updatePropertiesPanel();
            }
            document.getElementById('contextMenu').style.display = 'none';
        }

        function copyAnnotation() {
            // Implement copy functionality
            document.getElementById('contextMenu').style.display = 'none';
        }

        function cutAnnotation() {
            // Implement cut functionality
            document.getElementById('contextMenu').style.display = 'none';
        }

        function bringToFront() {
            // Implement bring to front
            document.getElementById('contextMenu').style.display = 'none';
        }

        function addBlankPage() {
            totalPages++;
            generatePageThumbnails();
            goToPage(totalPages);
        }

        function selectColor(color) {
            currentColor = color;
            
            // Update color picker UI
            document.querySelectorAll('.color-option').forEach(opt => {
                opt.classList.remove('selected');
                if (opt.style.backgroundColor === color) {
                    opt.classList.add('selected');
                }
            });
            
            if (selectedAnnotation) {
                selectedAnnotation.color = color;
                renderAnnotations(currentPage);
            }
        }

        function updateTextProperties() {
            currentFontFamily = document.getElementById('fontFamily').value;
            currentFontSize = parseInt(document.getElementById('fontSize').value);
            
            if (selectedAnnotation && selectedAnnotation.type === 'text') {
                selectedAnnotation.fontFamily = currentFontFamily;
                selectedAnnotation.fontSize = currentFontSize;
                renderAnnotations(currentPage);
            }
        }

        function updateOpacity() {
            const opacity = document.getElementById('opacity').value / 100;
            
            if (selectedAnnotation) {
                selectedAnnotation.opacity = opacity;
                renderAnnotations(currentPage);
            }
        }

        function updatePropertiesPanel() {
            if (selectedAnnotation) {
                document.getElementById('positionX').value = selectedAnnotation.x || '';
                document.getElementById('positionY').value = selectedAnnotation.y || '';
                document.getElementById('sizeWidth').value = selectedAnnotation.width || '';
                document.getElementById('sizeHeight').value = selectedAnnotation.height || '';
                document.getElementById('selectionInfo').textContent = `Selected: ${selectedAnnotation.type}`;
            } else {
                document.getElementById('positionX').value = '';
                document.getElementById('positionY').value = '';
                document.getElementById('sizeWidth').value = '';
                document.getElementById('sizeHeight').value = '';
                document.getElementById('selectionInfo').textContent = 'No selection';
            }
        }

        function updatePageInfo() {
            document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
        }

        function showLoading() {
            document.getElementById('loadingOverlay').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        // Additional utility functions
        function addImage() {

            alert('Image insertion would be implemented here');
        }

        function addSignature() {

            alert('Signature tool would open a drawing pad');
        }
    </script>
